name: BuildWatch checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --no-cache-dir -r requirements-maintenance.txt
      - run: python tests/pdf-encryption.test.py
      - run: pnpm check
      - name: Validate cached NC document interpretation (no HTTP or database writes)
        run: pnpm exec tsx scripts/nc-cached-maintenance.mts
      - name: Validate shared government platform fixtures (no live research)
        run: pnpm exec tsx scripts/validate-nc-platforms.mts
      - name: Validate PDF capacity safety boundaries (no live sources)
        env:
          NODE_OPTIONS: --max-old-space-size=768
        run: pnpm exec tsx scripts/pdf-50mb-benchmark.mts
      - run: pnpm dlx expo-doctor
      - run: pnpm export
      - run: pnpm export:web
