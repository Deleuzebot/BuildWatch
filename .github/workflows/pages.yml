name: Deploy public BuildWatch
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: buildwatch-pages-production
  cancel-in-progress: false
jobs:
  deploy:
    # Opt in only after adding this project to a GitHub repository and configuring
    # its scoped Cloudflare deployment credential. This is not a scheduled job.
    if: vars.BUILDWATCH_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build:public
      - name: Publish static assets only
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 010e34896e0e561d72187a43e1b9ffc5
          command: pages deploy dist-public --project-name=buildwatch --branch=main
