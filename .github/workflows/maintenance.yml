name: BuildWatch state research and maintenance
on:
  workflow_dispatch:
    inputs:
      validation_mode:
        description: Manual reliability validation (always dry-run; no publication)
        type: choice
        options: [none, pdf50-benchmark]
        default: none
      nc_adapter_pilot:
        description: Test disabled NC source candidates on Linux (always dry-run)
        type: boolean
        default: false
      nc_agenda_pdf_pilot:
        description: Test bounded official agenda PDF extraction (always dry-run)
        type: boolean
        default: false
      nc_continue_pilot:
        description: Resume the saved NC source samples (always dry-run)
        type: boolean
        default: false
      nc_source_audit:
        description: Run every registered NC source as a bounded review-only pilot (always dry-run)
        type: boolean
        default: false
      mode:
        type: choice
        options: [weekly, initial]
        default: weekly
      states:
        description: Comma separated state codes or rotation (inactive states are skipped)
        type: string
        default: NC
      dry_run:
        type: boolean
        default: true
      queued_requests:
        description: Process administrator-queued dry-run requests
        type: boolean
        default: false
      pilot_source:
        description: Optional registered source ID for a bounded pilot
        type: string
        default: ''
  # INTENTIONALLY DISABLED. Enable only after pilot validation and explicit approval.
  # schedule:
  #   - cron: '17 5 * * 1-5'
  #     timezone: America/New_York
permissions:
  contents: read
concurrency:
  group: buildwatch-maintenance
  cancel-in-progress: false
jobs:
  research:
    if: vars.BUILDWATCH_MAINTENANCE_CONFIGURED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: buildwatch-maintenance
    env:
      PGHOST: ${{ secrets.BW_WORKER_PGHOST }}
      PGPORT: ${{ secrets.BW_WORKER_PGPORT }}
      PGUSER: ${{ secrets.BW_WORKER_PGUSER }}
      PGPASSWORD: ${{ secrets.BW_WORKER_PGPASSWORD }}
      PGDATABASE: postgres
      PGPOOL_MAX: 1
      BW_ALLOW_LIVE_WRITES: 'false'
      BW_AI_ENABLED: 'false'
      BW_MODE: ${{ inputs.mode || 'weekly' }}
      BW_STATES: ${{ inputs.states || 'rotation' }}
      BW_DRY_RUN: ${{ github.event_name == 'schedule' || inputs.dry_run }}
      BW_QUEUE: ${{ inputs.queued_requests || false }}
      BW_PILOT_SOURCE: ${{ inputs.pilot_source || '' }}
      BW_NC_SOURCE_AUDIT: ${{ inputs.nc_source_audit || false }}
      BW_NC_CONTINUE: ${{ inputs.nc_continue_pilot || false }}
      BW_NC_ADAPTER: ${{ inputs.nc_adapter_pilot || false }}
      BW_NC_AGENDA: ${{ inputs.nc_agenda_pdf_pilot || false }}
      BW_VALIDATION_MODE: ${{ inputs.validation_mode || 'none' }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          # No Actions package cache or artifacts: avoid storage charges.
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded agenda text reader
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r requirements-maintenance.txt
      - name: Verify database TLS
        env:
          BW_WORKER_CA: ${{ secrets.BW_WORKER_CA }}
        run: |
          if [ -n "$BW_WORKER_CA" ]; then
            printf '%s' "$BW_WORKER_CA" > "$RUNNER_TEMP/buildwatch-ca.pem"
            echo "PGSSLROOTCERT=$RUNNER_TEMP/buildwatch-ca.pem" >> "$GITHUB_ENV"
          fi
      - name: Run bounded worker
        if: env.BW_NC_SOURCE_AUDIT != 'true' && env.BW_NC_CONTINUE != 'true' && env.BW_NC_ADAPTER != 'true' && env.BW_NC_AGENDA != 'true' && env.BW_VALIDATION_MODE == 'none'
        run: pnpm exec tsx scripts/maintenance.mts "--mode=$BW_MODE" "--states=$BW_STATES" "--dry-run=$BW_DRY_RUN" "--queue=$BW_QUEUE" "--source=$BW_PILOT_SOURCE"
      - name: Run NC source-readiness pilot (dry-run only)
        if: env.BW_NC_SOURCE_AUDIT == 'true' && env.BW_NC_CONTINUE != 'true'
        run: pnpm exec tsx scripts/nc-source-pilot.mts
      - name: Continue NC dry-run checkpoints
        if: env.BW_NC_CONTINUE == 'true'
        run: pnpm exec tsx scripts/nc-resume-pilot.mts
      - name: Test disabled NC source adapters
        if: env.BW_NC_ADAPTER == 'true'
        run: pnpm exec tsx scripts/nc-adapter-pilot.mts
      - name: Test NC agenda PDFs
        if: env.BW_NC_AGENDA == 'true'
        run: pnpm exec tsx scripts/nc-agenda-pilot.mts
      - name: Benchmark PDF resource boundaries
        if: env.BW_VALIDATION_MODE != 'none'
        env:
          NODE_OPTIONS: --max-old-space-size=768
        run: pnpm exec tsx scripts/pdf-50mb-benchmark.mts
      - name: Benchmark representative government PDFs
        if: env.BW_VALIDATION_MODE == 'pdf50-benchmark'
        env:
          NODE_OPTIONS: --max-old-space-size=768
        run: pnpm exec tsx scripts/nc-pdf50-real-benchmark.mts
      - name: Report failure
        if: failure()
        run: echo "::error::BuildWatch maintenance did not finish. Check the run summary and persistent Supabase checkpoints. Projects were not marked verified merely because this workflow ran."
